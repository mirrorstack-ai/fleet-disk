# smoke-real: the REAL one-liner of a published release (install-<serial>), run on the hosted runners.
# By hand only (workflow_dispatch), and only from main: the driver, the owner key's fingerprint (install.yml's KEY_SHA256) and the bootstrap
# digests (.github/smoke-real-pins.json) are all read from the checkout of main, never from the release under test. The release is read,
# never written: `gh release view` and `gh release download` of a public release, no secret, no Environment, no write permission.
# The check runs with no invite, so it stops before enrol, on a throwaway home; a file made anywhere else is a FAIL.
# Cost: every dispatch bills hosted-runner minutes on five legs, the macOS leg at the macOS multiplier (10x). Dispatch it once per
# published release (after the first publish), not in a loop.
name: smoke-real
on:
  workflow_dispatch:
    inputs:
      serial:
        description: the serial of the published release install-<serial> to check, digits only (its bootstrap digest must be pinned on main first)
        required: true
permissions:
  contents: read
concurrency:
  group: smoke-real
jobs:
  guard:      # a dispatch from another branch FAILS here, red, instead of skipping `real` and showing green with no case run
    name: from main only
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::smoke-real runs only from main (this dispatch is from $REF): nothing was checked"; exit 1; }
  real:
    needs: guard
    name: real ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            os: win
            must_run: true
          - runner: windows-2025
            os: win
            must_run: true
          - runner: ubuntu-24.04
            os: ubuntu
            must_run: true
          - runner: ubuntu-22.04      # refuses `os` before any network
            os: ubuntu
            must_run: false
          - runner: macos-15
            os: mac
            must_run: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python tests/fixture/smoke_driver.py probe
      - env:
          SERIAL: ${{ inputs.serial }}
          BOOT_OS: ${{ matrix.os }}
          BOOT_MUST: ${{ matrix.must_run }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          re='^(0|[1-9][0-9]{0,9})$'
          [[ $SERIAL =~ $re ]] || { echo "::error::serial must be digits only"; exit 1; }
          flag=()
          [ "$BOOT_MUST" = true ] && flag=(--must-run)
          python tests/fixture/smoke_driver.py real --serial "$SERIAL" --os "$BOOT_OS" --repo "$REPO" "${flag[@]}"
