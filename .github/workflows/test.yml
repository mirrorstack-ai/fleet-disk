name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    # 10 again (PW08, G-KITTEST-1). It was 20 from 2026-10-12, when the suite measured 600 s on this runner and the job was
    # cancelled one second after `OK`: 328 s of that was test_kit_deploy.OverHttp, each replay waiting about 5 s of real
    # time for a short-lived invite to expire. The test's fake kit now moves its own clock for that wait. Read the run's
    # `unit` duration before trusting 10: if a run is over 300 s, raise this again and record the duration in the gap.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]      # the floor and the newest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests
