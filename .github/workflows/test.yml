name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    # 20, not 10: measured 2026-10-12, the suite is 523 tests in 600 s on this runner (430 s on a Mac) and the job was
    # cancelled one second after `OK`. 328 s of it is test_kit_deploy.OverHttp: each replay waits about 6 s of real time for
    # a short-lived invite to expire, and there are about 55 replays. Shortening that wait is a separate change.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]      # the floor and the newest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests
