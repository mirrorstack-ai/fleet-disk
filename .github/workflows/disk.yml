# Builds the fleet's L1 disk: one dispatch converts Ubuntu's signed noble cloud image to a VHDX, publishes it as
# release disk-noble-<serial> in this repo and prints the two lock entries for the owner to pin and sign. The input
# reaches the script only through env:; the script refuses anything but Ubuntu's signature by the pinned key.
name: disk
on:
  workflow_dispatch:
    inputs:
      serial:
        description: the noble cloud image serial, 20260930 or 20260930.1
        required: true
permissions:
  contents: read
concurrency:
  group: disk
jobs:
  build:
    # main only: a branch's code never runs with a release-writing token
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils
      - env:
          SERIAL: ${{ inputs.serial }}
          GH_TOKEN: ${{ github.token }}
        run: python3 bin/fleet-disk.py "$SERIAL"
