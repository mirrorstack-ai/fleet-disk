name: kit-test
# The serverless kit host (Worker + Gate Durable Object, kit/): node built-ins only, no npm install, no secrets.
on:
  pull_request:
    paths: ["kit/**", ".github/workflows/kit-test.yml"]
  push:
    branches: [main]
    paths: ["kit/**", ".github/workflows/kit-test.yml"]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - run: node --test kit/
